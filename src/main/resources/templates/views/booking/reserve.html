<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver - FlyAndCo</title>
    
    <link rel="shortcut icon" th:href="@{/assets/compiled/svg/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
</head>

<body>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <div id="app">
        <div th:replace="fragments/sidebar :: sidebar"></div>

        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>Réserver un vol</h3>
                            <p class="text-subtitle text-muted">Complétez vos informations</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="/booking">Recherche</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Réservation</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row">
                    <!-- Détails du vol -->
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">Détails du vol</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <h4 class="text-primary">
                                        <span th:text="${vol.vol.aeroportDepart.codeIata}"></span> 
                                        → 
                                        <span th:text="${vol.vol.aeroportArrivee.codeIata}"></span>
                                    </h4>
                                </div>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>De:</span>
                                        <strong th:text="${vol.vol.aeroportDepart.ville}"></strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Vers:</span>
                                        <strong th:text="${vol.vol.aeroportArrivee.ville}"></strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Date:</span>
                                        <strong th:text="${#temporals.format(vol.dateHeureDepart, 'dd/MM/yyyy')}"></strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Départ:</span>
                                        <strong th:text="${#temporals.format(vol.dateHeureDepart, 'HH:mm')}"></strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Arrivée:</span>
                                        <strong th:text="${#temporals.format(vol.dateHeureArrivee, 'HH:mm')}"></strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Avion:</span>
                                        <strong th:text="${vol.avion.modele}"></strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Places disponibles:</span>
                                        <span class="badge bg-success" th:text="${placesDisponibles}"></span>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span>Prix par place:</span>
                                        <strong class="text-primary" th:text="${#numbers.formatDecimal(vol.prix, 0, 'COMMA', 0, 'POINT') + ' MGA'}"></strong>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Formulaire de réservation -->
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title">Informations du passager</h5>
                            </div>
                            <div class="card-body">
                                <form action="/booking/reserve" method="post">
                                    <input type="hidden" name="idVolProgramme" th:value="${vol.idVolProgramme}">
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="nom" class="form-label">Nom *</label>
                                            <input type="text" class="form-control" id="nom" name="nom" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="prenom" class="form-label">Prénom *</label>
                                            <input type="text" class="form-control" id="prenom" name="prenom" required>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="email" class="form-label">Email *</label>
                                            <input type="email" class="form-control" id="email" name="email" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="telephone" class="form-label">Téléphone</label>
                                            <input type="tel" class="form-control" id="telephone" name="telephone">
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="nombrePlaces" class="form-label">Nombre de places *</label>
                                            <select class="form-select" id="nombrePlaces" name="nombrePlaces" required onchange="updateTotal()">
                                                <option th:each="i : ${#numbers.sequence(1, placesDisponibles > 10 ? 10 : placesDisponibles)}"
                                                        th:value="${i}" th:text="${i}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Total à payer</label>
                                            <div class="form-control bg-light">
                                                <strong id="totalPrice" th:text="${#numbers.formatDecimal(vol.prix, 0, 'COMMA', 0, 'POINT') + ' MGA'}"></strong>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                        <a href="/booking" class="btn btn-secondary me-md-2">Annuler</a>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-check-circle"></i> Confirmer la réservation
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div class="float-start">
                        <p>2026 &copy; FlyAndCo</p>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script th:src="@{/assets/static/js/components/dark.js}"></script>
    <script th:src="@{/assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
    
    <script th:inline="javascript">
        const prixUnitaire = [[${vol.prix}]];
        
        function updateTotal() {
            const nombrePlaces = document.getElementById('nombrePlaces').value;
            const total = prixUnitaire * nombrePlaces;
            document.getElementById('totalPrice').textContent = total.toLocaleString('fr-FR') + ' MGA';
        }
    </script>
</body>

</html>
