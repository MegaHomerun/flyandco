<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de vols - FlyAndCo</title>
    
    <link rel="shortcut icon" th:href="@{/assets/compiled/svg/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
</head>

<body>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <div id="app">
        <div th:replace="fragments/sidebar :: sidebar"></div>

        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>Rechercher un vol</h3>
                            <p class="text-subtitle text-muted">Trouvez et réservez votre vol</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="/home">Accueil</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Recherche</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- Formulaire de recherche -->
                <section class="section">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">Rechercher un vol</h5>
                        </div>
                        <div class="card-body">
                            <form action="/booking/search" method="get">
                                <div class="row">
                                    <div class="col-md-3 mb-3">
                                        <label for="depart" class="form-label">Aéroport de départ</label>
                                        <select class="form-select" id="depart" name="depart" required>
                                            <option value="">-- Sélectionner --</option>
                                            <option th:each="aeroport : ${aeroports}" 
                                                    th:value="${aeroport.idAeroport}"
                                                    th:text="${aeroport.codeIata + ' - ' + aeroport.ville}"
                                                    th:selected="${idDepart != null && idDepart == aeroport.idAeroport}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="arrivee" class="form-label">Aéroport d'arrivée</label>
                                        <select class="form-select" id="arrivee" name="arrivee" required>
                                            <option value="">-- Sélectionner --</option>
                                            <option th:each="aeroport : ${aeroports}" 
                                                    th:value="${aeroport.idAeroport}"
                                                    th:text="${aeroport.codeIata + ' - ' + aeroport.ville}"
                                                    th:selected="${idArrivee != null && idArrivee == aeroport.idAeroport}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="date" class="form-label">Date de départ</label>
                                        <input type="date" class="form-control" id="date" name="date" 
                                               th:value="${dateRecherche}" required>
                                    </div>
                                    <div class="col-md-3 mb-3 d-flex align-items-end">
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bi bi-search"></i> Rechercher
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>

                <!-- Résultats de recherche -->
                <section class="section" th:if="${vols != null && !vols.isEmpty()}">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">
                                Vols disponibles 
                                <span th:if="${aeroportDepart != null && aeroportArrivee != null}">
                                    : <span th:text="${aeroportDepart.ville}"></span> → <span th:text="${aeroportArrivee.ville}"></span>
                                </span>
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Vol</th>
                                            <th>Avion</th>
                                            <th>Départ</th>
                                            <th>Arrivée</th>
                                            <th>Prix (MGA)</th>
                                            <th>Places dispo.</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="vol : ${vols}">
                                            <td>
                                                <strong th:text="${vol.volProgramme.vol.aeroportDepart.codeIata + ' → ' + vol.volProgramme.vol.aeroportArrivee.codeIata}"></strong>
                                            </td>
                                            <td th:text="${vol.volProgramme.avion.modele}"></td>
                                            <td>
                                                <span th:text="${#temporals.format(vol.volProgramme.dateHeureDepart, 'HH:mm')}"></span>
                                            </td>
                                            <td>
                                                <span th:text="${#temporals.format(vol.volProgramme.dateHeureArrivee, 'HH:mm')}"></span>
                                            </td>
                                            <td>
                                                <strong th:text="${#numbers.formatDecimal(vol.volProgramme.prix, 0, 'COMMA', 0, 'POINT')}"></strong>
                                            </td>
                                            <td>
                                                <span class="badge" 
                                                      th:classappend="${vol.placesDisponibles > 10 ? 'bg-success' : (vol.placesDisponibles > 0 ? 'bg-warning' : 'bg-danger')}"
                                                      th:text="${vol.placesDisponibles}"></span>
                                            </td>
                                            <td>
                                                <div class="btn-group" role="group">
                                                    <a th:if="${vol.placesDisponibles > 0}" 
                                                       th:href="@{/booking/reserve/{id}(id=${vol.volProgramme.idVolProgramme})}" 
                                                       class="btn btn-sm btn-primary">
                                                        Réserver
                                                    </a>
                                                    <span th:if="${vol.placesDisponibles == 0}" class="text-muted me-2">Complet</span>
                                                    <a th:href="@{/booking/ca/{id}(id=${vol.volProgramme.idVolProgramme})}" 
                                                       class="btn btn-sm btn-outline-info" title="Voir le CA">
                                                        <i class="bi bi-bar-chart"></i> CA
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Message si aucun vol -->
                <section class="section" th:if="${vols != null && vols.isEmpty()}">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> Aucun vol trouvé pour cette recherche.
                    </div>
                </section>
            </div>

            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div class="float-start">
                        <p>2026 &copy; FlyAndCo</p>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script th:src="@{/assets/static/js/components/dark.js}"></script>
    <script th:src="@{/assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
</body>

</html>
