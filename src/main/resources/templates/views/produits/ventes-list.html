<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventes Produits - FlyAndCo</title>
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3><i class="bi bi-cart-check"></i> Ventes Produits à Bord</h3>
                            <p class="text-subtitle text-muted">Historique des ventes de produits extra</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Accueil</a></li>
                                    <li class="breadcrumb-item active">Ventes Produits</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
            
            <section class="section">
                <!-- Messages Flash -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- Filtres -->
                <div class="card mb-3">
                    <div class="card-body">
                        <form th:action="@{/ventes-produits}" method="get" class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label">Date début</label>
                                <input type="date" class="form-control" name="dateDebut" th:value="${dateDebut}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Date fin</label>
                                <input type="date" class="form-control" name="dateFin" th:value="${dateFin}">
                            </div>
                            <div class="col-md-3">
                                <button type="submit" class="btn btn-outline-primary">
                                    <i class="bi bi-filter"></i> Filtrer
                                </button>
                                <a th:href="@{/ventes-produits}" class="btn btn-outline-secondary">Réinitialiser</a>
                            </div>
                            <div class="col-md-3 text-end">
                                <a th:href="@{/ventes-produits/nouveau}" class="btn btn-primary">
                                    <i class="bi bi-plus-lg"></i> Nouvelle Vente
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Liste des ventes -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Vol</th>
                                        <th>Produit</th>
                                        <th class="text-center">Quantité</th>
                                        <th class="text-end">Prix unit.</th>
                                        <th class="text-end">Montant</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="vente : ${ventes}">
                                        <td th:text="${#temporals.format(vente.dateVente, 'dd/MM/yyyy HH:mm')}"></td>
                                        <td>
                                            <span th:text="${vente.routeVol}"></span>
                                            <br>
                                            <small class="text-muted" 
                                                   th:text="${#temporals.format(vente.volProgramme.dateHeureDepart, 'dd/MM HH:mm')}"></small>
                                        </td>
                                        <td>
                                            <span th:text="${vente.produitExtra.nom}"></span>
                                            <br>
                                            <small class="text-muted" th:text="${vente.produitExtra.categorieProduit.nom}"></small>
                                        </td>
                                        <td class="text-center" th:text="${vente.quantite}"></td>
                                        <td class="text-end" th:text="${vente.produitExtra.prixFormate}"></td>
                                        <td class="text-end fw-bold" th:text="${vente.montantFormate}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(ventes)}">
                                        <td colspan="6" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                            Aucune vente enregistrée
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot th:if="${!#lists.isEmpty(ventes)}">
                                    <tr class="table-light fw-bold">
                                        <td colspan="3">Total</td>
                                        <td class="text-center" th:text="${totalQuantite}"></td>
                                        <td></td>
                                        <td class="text-end" th:text="${totalMontant}"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
</body>
</html>
