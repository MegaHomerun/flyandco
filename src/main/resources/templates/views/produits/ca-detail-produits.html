<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Produits - FlyAndCo</title>
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3><i class="bi bi-box-seam"></i> CA Produits - <span th:text="${moisLibelle}"></span></h3>
                            <p class="text-subtitle text-muted">Détail des ventes de produits extra</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Accueil</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/ca-mensuel}">CA Mensuel</a></li>
                                    <li class="breadcrumb-item active">Produits</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
            
            <section class="section">
                <div class="mb-3">
                    <a th:href="@{/ca-mensuel(annee=${annee}, mois=${mois})}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Retour CA Mensuel
                    </a>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Vol</th>
                                        <th>Produit</th>
                                        <th class="text-center">Quantité</th>
                                        <th class="text-end">Montant</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="vente : ${ventes}">
                                        <td th:text="${#temporals.format(vente.dateVente, 'dd/MM/yyyy')}"></td>
                                        <td>
                                            <span th:text="${vente.routeVol}"></span>
                                            <small class="text-muted d-block" 
                                                   th:text="${#temporals.format(vente.volProgramme.dateHeureDepart, 'HH:mm')}"></small>
                                        </td>
                                        <td th:text="${vente.produitExtra.nom}"></td>
                                        <td class="text-center" th:text="${vente.quantite}"></td>
                                        <td class="text-end" th:text="${vente.montantFormate}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(ventes)}">
                                        <td colspan="5" class="text-center text-muted py-4">
                                            Aucune vente ce mois
                                        </td>
                                    </tr>
                                </tbody>
                                <tfoot th:if="${!#lists.isEmpty(ventes)}">
                                    <tr class="table-light fw-bold">
                                        <td colspan="3">Total</td>
                                        <td class="text-center" th:text="${totalQuantite}"></td>
                                        <td class="text-end" th:text="${totalMontant}"></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
</body>
</html>
