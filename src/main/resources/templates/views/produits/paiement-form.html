<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Facture - FlyAndCo</title>
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3><i class="bi bi-cash"></i> Enregistrer un Paiement</h3>
                            <p class="text-subtitle text-muted">Facture <span th:text="${facture.numeroFacture}"></span></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <section class="section">
                <div class="row">
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body">
                                <h5>Récapitulatif</h5>
                                <p><strong>Montant facture:</strong> <span th:text="${facture.montantFormate}"></span></p>
                                <p><strong>Déjà payé:</strong> <span class="text-success" th:text="${facture.montantPayeFormate}"></span></p>
                                <p class="mb-0"><strong>Reste à payer:</strong> 
                                    <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(resteAPayer, 0, 'COMMA', 0, 'POINT')} + ' Ar'"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-body">
                                <form th:action="@{/ca-mensuel/factures-produits/{id}/paiement(id=${facture.idFactureProduit})}" method="post">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Date paiement <span class="text-danger">*</span></label>
                                            <input type="date" class="form-control" name="datePaiement" required 
                                                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Montant (Ar) <span class="text-danger">*</span></label>
                                            <input type="number" class="form-control" name="montant" required 
                                                   min="1" th:max="${resteAPayer}" step="100"
                                                   th:value="${resteAPayer}">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Mode de paiement <span class="text-danger">*</span></label>
                                            <select class="form-select" name="modePaiement" required>
                                                <option value="">-- Sélectionner --</option>
                                                <option value="virement">Virement</option>
                                                <option value="espèces">Espèces</option>
                                                <option value="chèque">Chèque</option>
                                                <option value="mobile_money">Mobile Money</option>
                                                <option value="carte">Carte</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Référence</label>
                                            <input type="text" class="form-control" name="reference" 
                                                   placeholder="N° virement, chèque...">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-12 mb-3">
                                            <label class="form-label">Notes</label>
                                            <input type="text" class="form-control" name="notes" 
                                                   placeholder="Notes optionnelles">
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <button type="submit" class="btn btn-success">
                                            <i class="bi bi-check-lg"></i> Enregistrer le paiement
                                        </button>
                                        <a th:href="@{/ca-mensuel/factures-produits/{id}(id=${facture.idFactureProduit})}" 
                                           class="btn btn-secondary">Annuler</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
</body>
</html>
