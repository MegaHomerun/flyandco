<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factures Produits - FlyAndCo</title>
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3><i class="bi bi-receipt"></i> Factures Produits</h3>
                            <p class="text-subtitle text-muted">Gestion des factures de ventes produits</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Accueil</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/ca-mensuel}">CA Mensuel</a></li>
                                    <li class="breadcrumb-item active">Factures</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
            
            <section class="section">
                <!-- Messages Flash -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="card-title mb-0">Liste des Factures</h4>
                        <a th:href="@{/ca-mensuel/factures-produits/creer}" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Créer Facture
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>N° Facture</th>
                                        <th>Date</th>
                                        <th>Période</th>
                                        <th class="text-end">Montant</th>
                                        <th class="text-end">Payé</th>
                                        <th class="text-center">Statut</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="facture : ${factures}">
                                        <td>
                                            <strong th:text="${facture.numeroFacture}"></strong>
                                        </td>
                                        <td th:text="${#temporals.format(facture.dateFacture, 'dd/MM/yyyy')}"></td>
                                        <td>
                                            <span th:text="${#temporals.format(facture.dateDebutPeriode, 'dd/MM')}"></span>
                                            -
                                            <span th:text="${#temporals.format(facture.dateFinPeriode, 'dd/MM/yyyy')}"></span>
                                        </td>
                                        <td class="text-end" th:text="${facture.montantFormate}"></td>
                                        <td class="text-end" th:text="${facture.montantPayeFormate}"></td>
                                        <td class="text-center">
                                            <span class="badge" th:classappend="${facture.statutBadgeClass}" 
                                                  th:text="${facture.statut}"></span>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{/ca-mensuel/factures-produits/{id}(id=${facture.idFactureProduit})}" 
                                               class="btn btn-sm btn-outline-primary">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(factures)}">
                                        <td colspan="7" class="text-center text-muted py-4">
                                            Aucune facture
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
</body>
</html>
