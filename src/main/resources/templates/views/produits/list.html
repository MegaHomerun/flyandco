<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits Extra - FlyAndCo</title>
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3><i class="bi bi-box-seam"></i> Produits Extra</h3>
                            <p class="text-subtitle text-muted">Gestion des produits vendus à bord</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Accueil</a></li>
                                    <li class="breadcrumb-item active">Produits</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
            
            <section class="section">
                <!-- Messages Flash -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="card-title mb-0">Liste des Produits</h4>
                        <a th:href="@{/produits/nouveau}" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Nouveau Produit
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Code</th>
                                        <th>Nom</th>
                                        <th>Catégorie</th>
                                        <th class="text-end">Prix</th>
                                        <th class="text-center">Statut</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="produit : ${produits}">
                                        <td>
                                            <code th:text="${produit.codeProduit}"></code>
                                        </td>
                                        <td th:text="${produit.nom}"></td>
                                        <td>
                                            <span class="badge bg-light-secondary" 
                                                  th:text="${produit.categorieProduit.nom}"></span>
                                        </td>
                                        <td class="text-end fw-bold" th:text="${produit.prixFormate}"></td>
                                        <td class="text-center">
                                            <span th:if="${produit.actif}" class="badge bg-success">Actif</span>
                                            <span th:unless="${produit.actif}" class="badge bg-secondary">Inactif</span>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{/produits/edit/{id}(id=${produit.idProduitExtra})}" 
                                               class="btn btn-sm btn-outline-primary">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(produits)}">
                                        <td colspan="6" class="text-center text-muted py-4">
                                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                            Aucun produit enregistré
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
</body>
</html>
