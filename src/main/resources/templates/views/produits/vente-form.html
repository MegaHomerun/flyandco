<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Vente - FlyAndCo</title>
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/compiled/css/app-dark.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div id="app">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div id="main">
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>
            
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3><i class="bi bi-cart-plus"></i> Enregistrer une Vente</h3>
                            <p class="text-subtitle text-muted">Vente de produit à bord d'un vol</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Accueil</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/ventes-produits}">Ventes</a></li>
                                    <li class="breadcrumb-item active">Nouvelle</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
            
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/ventes-produits/save}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="idVolProgramme" class="form-label">Vol programmé <span class="text-danger">*</span></label>
                                    <select class="form-select" id="idVolProgramme" name="idVolProgramme" required>
                                        <option value="">-- Sélectionner un vol --</option>
                                        <option th:each="vol : ${vols}" 
                                                th:value="${vol.idVolProgramme}"
                                                th:text="${vol.vol.aeroportDepart.codeIata + ' → ' + vol.vol.aeroportArrivee.codeIata + ' | ' + #temporals.format(vol.dateHeureDepart, 'dd/MM/yyyy HH:mm')}">
                                        </option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="idProduitExtra" class="form-label">Produit <span class="text-danger">*</span></label>
                                    <select class="form-select" id="idProduitExtra" name="idProduitExtra" required onchange="updatePrix()">
                                        <option value="" data-prix="0">-- Sélectionner un produit --</option>
                                        <option th:each="produit : ${produits}" 
                                                th:value="${produit.idProduitExtra}"
                                                th:data-prix="${produit.prixUnitaire}"
                                                th:text="${produit.nom + ' - ' + produit.prixFormate}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="quantite" class="form-label">Quantité <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" id="quantite" name="quantite" 
                                           required min="1" value="1" onchange="calculerMontant()">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Prix unitaire</label>
                                    <input type="text" class="form-control" id="prixAffiche" readonly>
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Montant total</label>
                                    <input type="text" class="form-control fw-bold" id="montantTotal" readonly 
                                           style="background-color: #e8f5e9;">
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="notes" class="form-label">Notes</label>
                                    <input type="text" class="form-control" id="notes" name="notes" 
                                           placeholder="Notes optionnelles">
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg"></i> Enregistrer la vente
                                </button>
                                <a th:href="@{/ventes-produits}" class="btn btn-secondary">
                                    <i class="bi bi-x-lg"></i> Annuler
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/assets/static/js/initTheme.js}"></script>
    <script th:src="@{/assets/compiled/js/app.js}"></script>
    
    <script>
        function updatePrix() {
            var select = document.getElementById('idProduitExtra');
            var option = select.options[select.selectedIndex];
            var prix = option.getAttribute('data-prix') || 0;
            document.getElementById('prixAffiche').value = formatMontant(prix) + ' Ar';
            calculerMontant();
        }
        
        function calculerMontant() {
            var select = document.getElementById('idProduitExtra');
            var option = select.options[select.selectedIndex];
            var prix = parseFloat(option.getAttribute('data-prix')) || 0;
            var quantite = parseInt(document.getElementById('quantite').value) || 0;
            var montant = prix * quantite;
            document.getElementById('montantTotal').value = formatMontant(montant) + ' Ar';
        }
        
        function formatMontant(montant) {
            return new Intl.NumberFormat('fr-FR').format(montant);
        }
    </script>
</body>
</html>
